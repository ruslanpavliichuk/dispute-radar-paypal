# Render Blueprint: Postgres, the API (with the agents running inside it) and the Next.js web app.
# Secrets marked sync: false are asked for once, in the Render dashboard; none are stored in this repo.
databases:
  - name: dispute-radar-db
    plan: basic-256mb
    postgresMajorVersion: "16"
    ipAllowList: []  # reachable from the services below only

services:
  - type: web
    name: dispute-radar-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: checksPass  # deploy after the GitHub Actions CI is green, not on every push
    # shortcut: the agents run in this process, so never scale above one instance. Models alone use ~230 MB;
    # if starter (512 MB) is killed for memory, change this to standard.
    plan: starter
    numInstances: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: dispute-radar-db, property: connectionString }
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com  # sandbox only; the API refuses anything else
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID  # from the webhook you register for this service's URL
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true  # the seller's password for the dashboard; read it from the dashboard once
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: AGENT_ENABLED
        value: "true"

  - type: web
    name: dispute-radar-web
    runtime: node
    rootDir: web
    autoDeployTrigger: checksPass
    plan: starter  # if the build runs out of memory (it bundles AG Grid, AG Charts, AG Studio and Bryntum), use standard
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"  # Next.js 16 needs Node 20.9 or newer
      - key: API_HOSTPORT  # private-network address of the API; next.config.ts forwards /api/* there
        fromService: { type: web, name: dispute-radar-api, property: hostport }
      - key: NEXT_PUBLIC_PAYPAL_CLIENT_ID  # the public sandbox client id, never the secret
        sync: false
      - key: NEXT_PUBLIC_AG_STUDIO_LICENSE
        sync: false
