[project]
name = "dispute-radar-paypal"
version = "0.1.0"
description = "Predicts and responds to PayPal disputes with calibrated ML models and agent-proposed actions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "paypal-server-sdk>=2.4,<3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "pyarrow>=17",
    "lightgbm>=4.7.0",
    "mlflow>=3.17.1",
    "scikit-learn>=1.9.1",
    "matplotlib>=3.11.2",
    "pyyaml>=6.0.3",
    "fastembed>=0.9.0",
]

[dependency-groups]
dev = [
    "channel3-sdk>=4.2.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
